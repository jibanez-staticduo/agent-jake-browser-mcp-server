# Example only — adjust the class, host and TLS to your cluster, or delete this
# file and reach the server some other way (an ssh tunnel, a VPN, a mesh).
#
# Two paths, two ports: /ws is the extension's WebSocket on 8765, everything
# else is the HTTP listener on 8000 (pairing page, extension download, /mcp).
#
# Do NOT publish this to the open internet on the strength of pairing alone.
# /pair/approve mints a working browser token for anyone who presents a valid
# code, and /mcp is unauthenticated. Put it on a private network, or in front of
# a proxy that authenticates, and let TLS terminate before it.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agent-jake-browser
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["browser-mcp.example.com"]
      secretName: agent-jake-browser-tls
  rules:
    - host: browser-mcp.example.com
      http:
        paths:
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: agent-jake-browser
                port:
                  name: browser-ws
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agent-jake-browser
                port:
                  name: mcp-http
