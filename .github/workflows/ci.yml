name: Product CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  server:
    runs-on: ${{ vars.AGENT_BROWSER_CI_RUNNER || 'ubuntu-latest' }}
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check compiled entrypoint and HTTP server
        run: |
          test -f dist/index.js
          node dist/index.js --help
          node --check http-server.js

